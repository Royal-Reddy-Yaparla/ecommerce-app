networks:
  default: 
    driver: bridge
    name: ecom # if not exist create network
volumes:
  mongodb:
  mysql:
  redis:
  rabbitmq: # create volume by docker 

services:
  mongodb:
    image: iamroyalreddy/ecom-mongodb:v2
    container_name: mongodb
    volumes:
    - mongodb:/data/db # refer image doc
  catalogue:
    image: iamroyalreddy/ecom-catalogue:v2
    container_name: catalogue
    environment:
      MONGO: true
      MONGO_URL: mongodb://mongodb:27017/catalogue
    depends_on:
    - mongodb
  redis:
    image: redis:7
    container_name: redis
    volumes:
    - redis:/data
  user:
    image: iamroyalreddy/ecom-user:v2
    container_name: user
    environment:
      REDIS_URL: redis://redis:6379 
      MONGO_URL: mongodb://mongodb:27017/users 
      MONGO: true
    depends_on:
      - mongodb
      - redis
  cart:
    image: iamroyalreddy/ecom-cart:v2
    container_name: cart
    environment:
      REDIS_HOST: redis  
      CATALOGUE_HOST: catalogue 
      CATALOGUE_PORT: 8080 
    depends_on:
    - catalogue
    - redis
  mysql:
    image: iamroyalreddy/ecom-mysql:v2
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql # refer image doc
  shipping:
    image: iamroyalreddy/ecom-shipping:v2
    container_name: shipping
    environment:
      CART_ENDPOINT: cart:8080
      DB_HOST: mysql
    depends_on:
    - mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq # refer image doc
  payment:
    image: iamroyalreddy/ecom-payment:v2
    container_name: payment
    environment:
      CART_HOST: cart 
      CART_PORT: 8080 
      USER_HOST: user 
      USER_PORT: 8080 
      AMQP_HOST: rabbitmq 
      AMQP_USER: roboshop 
      AMQP_PASS: roboshop123 
    depends_on:
    - rabbitmq
    - shipping
    - user
  frontend:
    image: iamroyalreddy/ecom-frontend:v2
    ports:
      - "80:80"
    depends_on:
    - catalogue
    - cart
    - user
    - shipping
    - payment


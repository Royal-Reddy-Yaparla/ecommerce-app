apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: mongodb
  namespace: ecom
  labels: 
    name: mongodb
    project: ecomapp
    tier: db
spec: 
  replicas: 1
  selector:
    matchLabels: 
      name: mongodb
      project: ecomapp
      tier: db
  template:
    metadata:
      labels:
        name: mongodb
        project: ecomapp
        tier: db
    spec: 
      containers: 
      - name: mongodb
        image: iamroyalreddy/ecom-mongodb:v2
        imagePullPolicy: Always
---
apiVersion: v1 
kind: Service
metadata:
  name: mongodb
  namespace: ecom
  labels:
    name: mongodb
    project: ecomapp
    tier: db
spec:
  selector:
    name: mongodb
    project: ecomapp
    tier: db
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017

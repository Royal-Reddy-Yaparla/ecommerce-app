apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: redis
  namespace: ecom
  labels: 
    name: redis
    project: ecomapp
    tier: db
spec: 
  replicas: 1
  selector:
    matchLabels: 
      name: redis
      project: ecomapp
      tier: db
  template:
    metadata:
      labels:
        name: redis
        project: ecomapp
        tier: db
    spec: 
      containers: 
      - name: redis
        image: redis:7
---
apiVersion: v1 
kind: Service
metadata:
  name: redis
  namespace: ecom
  labels:
    name: redis
    project: ecomapp
    tier: db
spec:
  selector:
    name: redis
    project: ecomapp
    tier: db
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
